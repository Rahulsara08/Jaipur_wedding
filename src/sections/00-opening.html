<div class="op" id="op" aria-label="Wedding invitation, tap to open">
  <!-- the wax-sealed patrika: a velvet maroon envelope with a lace flap, addressed to the guest. Tap: the seal breaks,
       the flap opens, the card (a copy of page 1) rises out and zooms to fill the screen, its paper turns into page 1's
       sky and Hawa Mahal rises; then the real page 1, in the same place underneath, takes over (js/opening.js) -->
  <i class="op-bg" aria-hidden="true"></i><i class="op-shade" aria-hidden="true"></i>
  <p class="op-welcome" id="opWelcome" aria-label="Welcome to Jaipur"><span class="ow-script" aria-hidden="true">Welcome to</span><span class="ow-city" aria-hidden="true"><span style="--i:0" data-l="J">J</span><span style="--i:1" data-l="a">a</span><span style="--i:2" data-l="i">i</span><span style="--i:3" data-l="p">p</span><span style="--i:4" data-l="u">u</span><span style="--i:5" data-l="r">r</span></span><span class="ow-rule" aria-hidden="true"><i></i><b></b><i></i></span></p>
  <i class="op-ep op-back" id="opBack"></i>
  <div class="op-card" id="opCard" aria-hidden="true"><div class="op-frame" id="opFrame"><i></i><i></i><i></i><i></i></div></div>
  <div class="op-ep op-pocket" id="opPocket">
    <div class="op-pk l"><i id="opPkL"></i></div><div class="op-pk r"><i id="opPkR"></i></div><div class="op-pk b"><i id="opPkB"></i></div>
    <svg id="opPsvg" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="op-to" id="opTo"><span class="k">Dear</span><span class="g guest-name">Family &amp; Friends</span><span class="i">you are cordially invited</span></div>
  </div>
  <div class="op-ep op-flap" id="opFlap" aria-hidden="true"><i class="face front"></i><i class="face back" id="opFlapBack"></i><svg id="opFsvg" preserveAspectRatio="none"></svg></div>
  <div class="op-ep op-seal" id="opSeal" aria-hidden="true">
    <div class="h l" id="opSealL"><div class="wax"><b>S<i>|</i>A</b></div></div>
    <div class="h r" id="opSealR"><div class="wax"><b>S<i>|</i>A</b></div></div>
    <svg class="crack" id="opCrack" viewBox="0 0 100 100"><polyline points="74,0 66,15 75,30 60,47 68,62 52,80 58,100" fill="none" stroke="#3a0410" stroke-width="2.6" stroke-linejoin="round"/><polyline points="60,47 46,42 38,46" fill="none" stroke="#3a0410" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
  <p class="op-ep op-hint" id="opHint">Tap the seal to open</p>
  <button class="op-tap" id="opTap" type="button" aria-label="Open the invitation"></button>
  <i class="op-black" id="opBlack"></i>
</div>
